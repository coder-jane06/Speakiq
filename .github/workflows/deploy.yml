name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Build and type-check
        run: npm run build
        working-directory: frontend
        env:
          VITE_BASE_PATH: /Speakiq/
          VITE_API_URL: https://shaurya0606-speakiq-backend.hf.space
          VITE_SUPABASE_URL: https://gakfjshqzwtgqpkftnyd.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdha2Zqc2hxend0Z3Fwa2Z0bnlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDIwNTcsImV4cCI6MjA5NDUxODA1N30.GA8j5tlSxx8Qpl6I1SA6QJYg97G0oxxp_NayU9z4uMM
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Copy index.html to 404.html (SPA fallback)
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          publish_branch: gh-pages

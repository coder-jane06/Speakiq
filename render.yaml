services:
  - type: web
    name: speakiq-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: starter
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      # These variables must be populated securely in the Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
